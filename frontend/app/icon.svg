<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter to create the smooth white outline/sticker effect from the image -->
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="10" in="SourceAlpha" result="dilated"/>
      <feGaussianBlur stdDeviation="2" in="dilated" result="blurred"/>
      <feComponentTransfer in="blurred" result="hardOutline">
        <feFuncA type="linear" slope="20"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="hardOutline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Espresso background with subtle rounded corners (Adjusted for 500x500 viewBox) -->
  <rect width="500" height="500" rx="90" fill="#2B1810"/>

  <!-- Background White Matte Sticker Base + Main Gold Gothic S -->
  <g filter="url(#outline)">
    <!-- Main Letter Silhouette (Changed to Gold #C9A15A) -->
    <path d="M 235,50 
             C 275,55 315,65 350,75 
             L 370,55 
             L 345,115 
             C 310,105 270,95 235,100
             C 200,105 180,120 170,140
             C 160,165 175,185 205,200
             C 230,210 270,225 315,240
             C 365,255 405,280 415,325
             C 425,370 395,420 345,455
             C 310,480 270,490 235,465
             C 200,445 160,425 125,415
             L 165,365
             C 195,375 230,390 260,390
             C 290,390 310,380 315,360
             C 320,335 300,320 265,305
             C 225,290 180,270 150,245
             C 115,215 110,170 130,125
             C 150,80 190,50 235,50 Z" 
          fill="#C9A15A" />
          
    <!-- Decorative Center Cutout/Inner Crescent Accent (Kept White to match the sticker outline) -->
    <path d="M 215,255 
             C 235,255 260,265 295,280
             C 330,295 345,315 345,340
             C 345,360 335,385 320,405
             C 335,370 335,335 305,310
             C 280,290 245,275 215,275
             Z" 
          fill="#FFFFFF" />
  </g>
</svg>